kind = "web"
previewPath = "/"
title = "Habinix LLC Website"
version = "1.0.0"
id = "artifacts/habinix-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19594

[services.development]
run = "pnpm --filter @workspace/habinix-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/habinix-website", "run", "build" ]
publicDir = "artifacts/habinix-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19594"
BASE_PATH = "/"
